# =====================================================================
# SIT722 10.3HD - KoalaTech Ephemeral E2E Quality Gate
#
# Purpose:
# Automatically create a disposable KoalaTech environment in GitHub
# Actions, execute an authenticated multi-service business journey,
# use the E2E result as a CI quality gate, always remove the temporary
# environment, and promote a validated image to ACR only after PASS.
#
# Tested journey:
#
# User Service -> Admin JWT
#                    |
#                    v
# Student Service -> Course Service -> Enrollment Service
#
# Quality-gate behaviour:
#
# PASS -> ACR promotion job runs
# FAIL -> ACR promotion job is skipped
#
# Cleanup executes even when the quality gate fails.
# =====================================================================

name: 10.3HD - Ephemeral E2E Quality Gate


# =====================================================================
# 1. WORKFLOW TRIGGERS
# =====================================================================
# Normal CI execution occurs whenever work is pushed to the dedicated
# task-10.3hd branch.
#
# workflow_dispatch also lets us manually demonstrate a controlled
# quality-gate failure without deliberately breaking application code.
# =====================================================================

on:
  push:
    branches:
      - task-10.3hd

  workflow_dispatch:
    inputs:
      force_failure:
        description: "Demonstrate the quality gate blocking the pipeline"
        required: true
        default: false
        type: boolean


# =====================================================================
# 2. MINIMUM REQUIRED PERMISSIONS
# =====================================================================
# Repository source is read-only.
# Azure authentication for the PASS-only ACR promotion uses the
# existing AZURE_CREDENTIALS GitHub secret.
# =====================================================================

permissions:
  contents: read


jobs:

  # ===================================================================
  # AUTHENTICATED EPHEMERAL E2E TEST
  # ===================================================================

  ephemeral-e2e-quality-gate:

    name: Authenticated Ephemeral E2E Quality Gate

    runs-on: ubuntu-latest

    timeout-minutes: 20

    env:

      # Unique project name keeps every temporary environment isolated.
      COMPOSE_PROJECT_NAME: koalatech-e2e-${{ github.run_id }}

      # Normal push = false.
      # Manual run may set true to prove the quality gate blocks.
      E2E_FORCE_FAILURE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_failure || 'false' }}


    steps:

      # ---------------------------------------------------------------
      # STEP 1 - CHECK OUT THE APPLICATION
      # ---------------------------------------------------------------

      - name: Checkout KoalaTech source
        uses: actions/checkout@v4


      # ---------------------------------------------------------------
      # STEP 2 - PREPARE PYTHON
      # ---------------------------------------------------------------

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ---------------------------------------------------------------
      # STEP 2B - INSTALL PYTEST
      # ---------------------------------------------------------------

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest


      # ---------------------------------------------------------------
      # STEP 3 - VALIDATE THE E2E INFRASTRUCTURE DEFINITION
      # ---------------------------------------------------------------

      - name: Validate ephemeral Compose configuration
        run: |
          echo "Validating KoalaTech ephemeral environment..."

          docker compose \
            -f docker-compose.e2e.yml \
            config --quiet

          echo "Compose configuration is valid."


      # ---------------------------------------------------------------
      # STEP 4 - BUILD AND START THE TEMPORARY ENVIRONMENT
      # ---------------------------------------------------------------
      # --build tests source from this exact Git commit.
      # --wait prevents E2E execution until services report healthy.
      # ---------------------------------------------------------------

      - name: Build and start ephemeral KoalaTech environment
        run: |
          echo "Building temporary KoalaTech E2E environment..."

          docker compose \
            -f docker-compose.e2e.yml \
            up \
            --detach \
            --build \
            --wait

          echo "Ephemeral environment is ready."


      # ---------------------------------------------------------------
      # STEP 5 - DISPLAY ENVIRONMENT READINESS
      # ---------------------------------------------------------------

      - name: Verify temporary service state
        run: |
          echo "Current KoalaTech E2E service state:"

          docker compose \
            -f docker-compose.e2e.yml \
            ps


      # ---------------------------------------------------------------
      # STEP 6 - RUN THE AUTHENTICATED BUSINESS JOURNEY
      # ---------------------------------------------------------------
      # The pytest E2E test performs:
      #
      # 1. API readiness verification
      # 2. Real administrator authentication
      # 3. JWT validation
      # 4. Student creation and persistence check
      # 5. Course creation and persistence check
      # 6. Enrollment creation
      # 7. Relationship verification by enrollment/student/course
      #
      # Any failed assertion returns a non-zero exit code.
      # Therefore this step is the actual CI/CD quality gate.
      # ---------------------------------------------------------------

      - name: Run authenticated KoalaTech E2E quality gate
        run: |
          echo "Starting authenticated multi-service E2E journey..."
          echo "Controlled failure mode: ${E2E_FORCE_FAILURE}"

          python -m pytest -v -s e2e/test_pytest_quality_gate.py


      # ---------------------------------------------------------------
      # STEP 7 - COLLECT FAILURE DIAGNOSTICS
      # ---------------------------------------------------------------

      - name: Collect diagnostics when quality gate fails
        if: failure()
        run: |
          echo "E2E quality gate failed."
          echo "Collecting temporary environment diagnostics..."

          echo ""
          echo "================ CONTAINER STATE ================"

          docker compose \
            -f docker-compose.e2e.yml \
            ps \
            --all || true

          echo ""
          echo "================ SERVICE LOGS ==================="

          docker compose \
            -f docker-compose.e2e.yml \
            logs \
            --no-color \
            --tail=100 || true


      # ---------------------------------------------------------------
      # STEP 8 - GUARANTEED EPHEMERAL CLEANUP
      # ---------------------------------------------------------------
      # if: always() guarantees cleanup on both PASS and FAIL.
      #
      # --volumes removes temporary PostgreSQL data.
      # --remove-orphans removes unexpected Compose containers.
      # ---------------------------------------------------------------

      - name: Always destroy ephemeral E2E environment
        if: always()
        run: |
          echo "Destroying temporary KoalaTech E2E environment..."

          docker compose \
            -f docker-compose.e2e.yml \
            down \
            --volumes \
            --remove-orphans

          echo "Ephemeral cleanup completed."


      # ---------------------------------------------------------------
      # STEP 9 - SUCCESS SUMMARY
      # ---------------------------------------------------------------

      - name: Report successful quality gate
        if: success()
        run: |
          echo "======================================================"
          echo "KOALATECH 10.3HD E2E QUALITY GATE: PASS"
          echo "Authenticated Student -> Course -> Enrollment"
          echo "business journey completed successfully."
          echo "Temporary environment was removed after validation."
          echo "PASS-only ACR promotion is now permitted."
          echo "======================================================"


  # ===================================================================
  # PASS-ONLY AZURE CONTAINER REGISTRY PROMOTION
  # ===================================================================
  # This job directly depends on the authenticated E2E quality gate.
  #
  # PASS -> this job runs and pushes the validated image to ACR.
  # FAIL -> GitHub Actions automatically skips this entire job.
  #
  # This demonstrates that the E2E result controls whether an
  # application artifact is permitted to progress through CI/CD.
  # ===================================================================

  acr-promotion:

    name: PASS-Only Promotion to Azure Container Registry

    needs:
      - ephemeral-e2e-quality-gate

    runs-on: ubuntu-latest

    timeout-minutes: 15

    env:
      ACR_NAME: viswa103hd226051707
      ACR_LOGIN_SERVER: viswa103hd226051707.azurecr.io
      IMAGE_NAME: koalatech-student-service


    steps:

      # ---------------------------------------------------------------
      # STEP 1 - CHECK OUT THE VALIDATED COMMIT
      # ---------------------------------------------------------------

      - name: Checkout validated KoalaTech source
        uses: actions/checkout@v4


      # ---------------------------------------------------------------
      # STEP 2 - AUTHENTICATE TO AZURE
      # ---------------------------------------------------------------

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}


      # ---------------------------------------------------------------
      # STEP 3 - AUTHENTICATE TO THE TEMPORARY ACR
      # ---------------------------------------------------------------
      # Registry credentials are retrieved inside the GitHub runner
      # and passed directly to docker login through stdin.
      # ---------------------------------------------------------------

      - name: Login to temporary Azure Container Registry
        shell: bash
        run: |
          ACR_USERNAME=$(az acr credential show \
            --name "$ACR_NAME" \
            --query username \
            -o tsv)

          ACR_PASSWORD=$(az acr credential show \
            --name "$ACR_NAME" \
            --query "passwords[0].value" \
            -o tsv)

          echo "$ACR_PASSWORD" | docker login \
            "$ACR_LOGIN_SERVER" \
            --username "$ACR_USERNAME" \
            --password-stdin


      # ---------------------------------------------------------------
      # STEP 4 - BUILD AN IMAGE FROM THE PASS-VALIDATED COMMIT
      # ---------------------------------------------------------------

      - name: Build PASS-validated Docker image
        run: |
          echo "E2E quality gate passed."
          echo "Building validated KoalaTech Student Service image..."

          docker build \
            --platform linux/amd64 \
            -t $ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }} \
            ./student-service


      # ---------------------------------------------------------------
      # STEP 5 - PUSH ONLY AFTER E2E PASS
      # ---------------------------------------------------------------

      - name: Push PASS-validated image to ACR
        run: |
          echo "Pushing image because the E2E quality gate passed..."

          docker push \
            $ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}


      # ---------------------------------------------------------------
      # STEP 6 - VERIFY THE PROMOTED IMAGE EXISTS IN ACR
      # ---------------------------------------------------------------

      - name: Verify image stored in ACR
        shell: bash
        run: |
          echo "======================================================"
          echo "E2E QUALITY GATE: PASSED"
          echo "ACR PROMOTION: ALLOWED"
          echo "IMAGE: $ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}"
          echo "======================================================"

          az acr repository show-tags \
            --name "$ACR_NAME" \
            --repository "$IMAGE_NAME" \
            --output table