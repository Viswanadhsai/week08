name: 01 - CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  # =========================================================
  # Terraform Infrastructure Check
  # =========================================================
  terraform-check:
    name: Terraform Validate and Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -input=false -no-color


  # =========================================================
  # Monitoring Validation
  # =========================================================
  monitoring-check:
    name: Validate Prometheus and Grafana
    runs-on: ubuntu-latest

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Connect to AKS
        run: |
          az aks get-credentials \
            --resource-group deakinuni \
            --name viswa102daks \
            --overwrite-existing

      - name: Validate Monitoring Pods
        run: |
          kubectl wait \
            --for=condition=Ready \
            pod \
            --all \
            -n monitoring \
            --timeout=180s

          echo "===== Monitoring Pods ====="
          kubectl get pods -n monitoring

          echo "===== Monitoring Services ====="
          kubectl get svc -n monitoring


  # =========================================================
  # Backend Tests
  # =========================================================
  backend-test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - service: user-service
            database: users
            port: 5433

          - service: student-service
            database: students
            port: 5434

          - service: lecturer-service
            database: lecturers
            port: 5435

          - service: course-service
            database: courses
            port: 5436

          - service: enrollment-service
            database: enrollments
            port: 5437

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ matrix.database }}

        ports:
          - ${{ matrix.port }}:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d ${{ matrix.database }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ${{ matrix.database }}
      POSTGRES_HOST: localhost
      POSTGRES_PORT: ${{ matrix.port }}

      JWT_SECRET_KEY: koalatech-ci-test-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

      DEFAULT_ADMIN_USERNAME: admin
      DEFAULT_ADMIN_EMAIL: admin@koalatech.edu.au
      DEFAULT_ADMIN_PASSWORD: AdminPassword123!

      AZURE_STORAGE_CONNECTION_STRING: ""
      AZURE_STORAGE_CONTAINER_NAME: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: |
          pytest -v


  # =========================================================
  # Build, Docker Scout Scan and Push
  # =========================================================
  build-and-push:
    name: Build and Push ${{ matrix.image }}
    runs-on: ubuntu-latest

    needs:
      - backend-test
      - terraform-check
      - monitoring-check

    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    env:
      ACR_NAME: viswa722acr102ds226051707
      ACR_LOGIN_SERVER: viswa722acr102ds226051707.azurecr.io

    strategy:
      fail-fast: false

      matrix:
        include:
          - service: frontend
            image: koalatech-frontend

          - service: user-service
            image: koalatech-user-service

          - service: student-service
            image: koalatech-student-service

          - service: lecturer-service
            image: koalatech-lecturer-service

          - service: course-service
            image: koalatech-course-service

          - service: enrollment-service
            image: koalatech-enrollment-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        shell: bash
        run: |
          ACR_USERNAME=$(az acr credential show \
            --name "$ACR_NAME" \
            --query username \
            -o tsv)

          ACR_PASSWORD=$(az acr credential show \
            --name "$ACR_NAME" \
            --query "passwords[0].value" \
            -o tsv)

          echo "$ACR_PASSWORD" | docker login \
            "$ACR_LOGIN_SERVER" \
            --username "$ACR_USERNAME" \
            --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t $ACR_LOGIN_SERVER/${{ matrix.image }}:${{ github.sha }} \
            ./${{ matrix.service }}

      - name: Docker Scout CVE Scan
        if: matrix.service == 'student-service'
        uses: docker/scout-action@v1
        with:
          command: cves
          image: local://${{ env.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}
          dockerhub-user: msviswa
          dockerhub-password: ${{ secrets.DOCKER_SCOUT_TOKEN }}
          only-severities: critical,high
          exit-code: false
          summary: true

      - name: Docker Scout Recommendations
        if: matrix.service == 'student-service'
        uses: docker/scout-action@v1
        with:
          command: recommendations
          image: local://${{ env.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}
          dockerhub-user: msviswa
          dockerhub-password: ${{ secrets.DOCKER_SCOUT_TOKEN }}
          summary: true

      - name: Push Docker image with commit SHA
        run: |
          docker push \
            $ACR_LOGIN_SERVER/${{ matrix.image }}:${{ github.sha }}